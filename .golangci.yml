# Shared golangci-lint v2 baseline — adopted from
# zeroroot-ai/.github/templates/golangci-base.yml (slice 2.2, gibson#172).
# Linter set lives in the base; per-repo section below is the only place
# to add repo-specific exclusions.

version: "2"

linters:
  default: none
  enable:
    - staticcheck
    - govet
    - errcheck
    - ineffassign
    - unused
    - exhaustive
    - gosec
    - errorlint
    - wrapcheck
    - nilerr
    - contextcheck
    - fatcontext
    # depguard disabled — requires explicit rules config to avoid blocking
    # all third-party imports; see zeroroot-ai/.github#93 for the org-level fix.
    - gocritic
    - revive
    - gocyclo
    - prealloc
    - dupl
    - copyloopvar
    - gocheckcompilerdirectives
    - intrange
    - mirror
    - perfsprint
    - sloglint
    - testifylint
    - thelper
    - usestdlibvars
    - whitespace

  settings:
    staticcheck:
      checks: ["all"]
    gosec:
      severity: medium
    exhaustive:
      default-signifies-exhaustive: false
      check: [switch]
    wrapcheck:
      # The first nine entries are the default list of wrapcheck. ignore-sigs
      # replaces that list, so it repeats it. The last two are the input
      # validators of internal/kit: kit.CheckString and kit.CheckRange return
      # kit.ErrInvalidInput with the name of the field, and a second wrap would
      # only repeat the text. Every other error of internal/kit, for example
      # from kit.Client.Do or ClientCredentials.Token, must be wrapped at the
      # call site. kit.GraphError is the exception: it adds the name of the
      # operation and the Graph error code itself.
      ignore-sigs:
        - github.com/zeroroot-ai/connectors/internal/kit.GraphError(
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        - github.com/zeroroot-ai/connectors/internal/kit.CheckString(
        - github.com/zeroroot-ai/connectors/internal/kit.CheckRange(
    gocyclo:
      min-complexity: 20
    dupl:
      threshold: 150
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks: [hugeParam, rangeValCopy]

  exclusions:
    paths:
      - ".*\\.pb\\.go$"
      - ".*_grpc\\.pb\\.go$"
      - "zz_generated.*\\.go$"
      - "api/gen/.*"
    rules: []

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

