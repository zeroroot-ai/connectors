name: image
# Build and cosign-sign one image for each server directory, through the org
# reusable image-build workflow (the same call as cve-triage). Gibson pins an
# image of this repo by digest in a catalog manifest (ADR-0177).
#
# The plan job lists each directory that has a Dockerfile, so a new server
# needs no edit here. The digests job prints the digest of each image to the
# run summary. On a release tag it also adds the digests to the release notes.
#
# Trigger discipline: push:main (sha-tagged), the release tag that
# release-please cuts (`v*`), and workflow_dispatch. Never on a pull request,
# and never on a schedule.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      servers: ${{ steps.list.outputs.servers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: list
        run: |
          servers="$(for f in */Dockerfile; do dirname "$f"; done | grep -v '^_' | jq -R . | jq -sc .)"
          echo "servers=$servers" >> "$GITHUB_OUTPUT"
          echo "servers: $servers"

  image:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.plan.outputs.servers) }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@88cbc77697ff7143c98f29f3c4d80a93a666d601 # v0.23.0
    with:
      component_name: ${{ matrix.server }}
      component_path: .
      dockerfile_path: ${{ matrix.server }}/Dockerfile
      image_name: ghcr.io/zeroroot-ai/connectors-${{ matrix.server }}
      # GOTOOLCHAIN=local as a build-arg (.github#22): the build fails when
      # go.mod names a Go that the pinned base does not carry.
      go_toolchain_local: true
      tag_pattern: type=match,pattern=v(.*)
      # VERSION is stamped into the binary. A tagged build reports its
      # release, and a main build reports the branch.
      build_args: |
        VERSION=${{ github.ref_name }}

  digests:
    name: digests
    needs: [plan, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Print the digest of each image
        shell: bash
        env:
          SERVERS: ${{ needs.plan.outputs.servers }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The reusable build always pushes the tag sha-<7 characters of the commit>.
          # scripts/digest-table.sh puts an image with the label
          # ai.zeroroot.image-class=test in its own table. A failed inspect fails
          # the step, because the shell runs with pipefail.
          scripts/digest-table.sh "$SERVERS" "sha-${GITHUB_SHA::7}" | tee table.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$REF_TYPE" = tag ]; then
            gh release view "$REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md
            { cat notes.md; echo; echo "## Image digests"; echo; cat table.md; } > notes-new.md
            gh release edit "$REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes-new.md
          fi
